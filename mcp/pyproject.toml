[project]
name = "traces-mcp"
version = "0.1.0"
description = "Local AI sourcing MCP + HTTP server for KiCad / EDA"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "fastapi",
    "uvicorn",
    "requests",
    "python-dotenv",
    "easyeda2kicad",
]

[project.scripts]
traces-mcp = "traces_mcp.mcp_server:main"
traces-serve = "traces_mcp.app:main"
traces-eval = "traces_mcp.eval:main"
traces-bench = "traces_mcp.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traces_mcp"]
